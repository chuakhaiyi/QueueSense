services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - queue-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "app/dashboard.py", "--server.address", "0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - queue-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  queue-data:
